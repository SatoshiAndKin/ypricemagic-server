networks:
  rpc-ethereum:
  traefik-proxy:
    external: true
    name: traefik-proxy

x-ypm-service: &ypm-service
  build: .
  init: true
  mem_limit: 8g
  memswap_limit: 8g
  healthcheck:
    test: ["CMD-SHELL", "test ! -f /tmp/drain && curl -sf http://localhost:8001/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 1
    start_period: 600s
  networks:
    - traefik-proxy
  restart: unless-stopped
  stop_grace_period: 310s

services:
  rpc-ethereum:
    image: ghcr.io/satoshiandkin/web3-proxy:latest
    platform: linux/amd64
    init: true
    mem_limit: 4g
    memswap_limit: 4g
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    command: [--workers, "2", --config, /run/config/proxy.toml, proxyd, --port, "8544"]
    volumes:
      - ./rpc/ethereum.toml:/run/config/proxy.toml:ro
    networks:
      - rpc-ethereum
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", http://127.0.0.1:8544/health]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    stop_grace_period: 30s

  ypm-ethereum:
    <<: *ypm-service
    networks:
      - traefik-proxy
      - rpc-ethereum
    depends_on:
      rpc-ethereum:
        condition: service_healthy
    environment:
      CHAIN_NAME: ethereum
      CHAIN_ID: 1
      YPRICEMAGIC_GETLOGS_DOP: ${YPRICEMAGIC_GETLOGS_DOP_ETHEREUM:-8}
      YPRICEMAGIC_GETLOGS_BATCH_SIZE: ${YPRICEMAGIC_GETLOGS_BATCH_SIZE_ETHEREUM:-10000}
      ETHERSCAN_TOKEN: ${ETHERSCAN_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DANKMIDS_REQUESTS_PER_SECOND: 500
      DANKMIDS_MAX_JSONRPC_BATCH_SIZE: 1000
    volumes:
      - cache-ethereum:/data/cache
      - brownie-ethereum:/root/.brownie
      - solcx:/root/.solcx
      - vvm:/root/.vvm
      - ypricemagic-ethereum:/root/.ypricemagic
      - appcache-ethereum:/app/cache
    labels:
      traefik.enable: "true"
      traefik.docker.allownonrunning: "true"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 10"
      traefik.http.routers.ypm-ethereum.rule: "Host(`${VIRTUAL_HOST:-localhost}`) && PathPrefix(`/ethereum`)"
      traefik.http.routers.ypm-ethereum.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.middlewares.ypm-strip-ethereum.stripprefix.prefixes: /ethereum
      traefik.http.routers.ypm-ethereum.middlewares: ypm-strip-ethereum
      # Keep the service name; its image exposes one port. Empty services must have no server.
      traefik.http.services.ypm-ethereum.loadbalancer.passhostheader: "true"
      traefik.http.routers.ypm-health.rule: "Host(`${VIRTUAL_HOST:-localhost}`) && Path(`/health`)"
      traefik.http.routers.ypm-health.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.routers.ypm-health.service: ypm-ethereum

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    labels:
      traefik.enable: "true"
      traefik.docker.allownonrunning: "true"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 10"
      traefik.http.routers.ypm-frontend.rule: "Host(`${VIRTUAL_HOST:-localhost}`) && !PathPrefix(`/ethereum`) && !PathPrefix(`/arbitrum`) && !PathPrefix(`/optimism`) && !PathPrefix(`/base`) && !PathPrefix(`/bsc`) && !PathPrefix(`/polygon`) && !PathPrefix(`/fantom`) && !PathPrefix(`/health`)"
      traefik.http.routers.ypm-frontend.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.routers.ypm-frontend.priority: "1"
      # Keep the service name; its image exposes one port. Empty services must have no server.
      traefik.http.services.ypm-frontend.loadbalancer.passhostheader: "true"
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  cache-ethereum:
  brownie-ethereum:
  solcx:
  vvm:
  ypricemagic-ethereum:
  appcache-ethereum:
  cache-base:
  brownie-base:
  ypricemagic-base:
  appcache-base:
