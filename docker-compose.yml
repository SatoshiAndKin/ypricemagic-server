networks:
  traefik-proxy:
    name: traefik-proxy

services:
  traefik:
    image: traefik:v3
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedheaders.trustedips=${TRUSTED_PROXY_IPS:-127.0.0.1/32,::1/128}"
      - "--entrypoints.web2.address=:81"
      - "--entrypoints.web2.forwardedheaders.trustedips=${TRUSTED_PROXY_IPS:-127.0.0.1/32,::1/128}"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--ping=true"
    ports:
      - "127.0.0.1:${PORT:-8000}:80"
      - "127.0.0.1:${SECONDARY_PORT:-8001}:81"
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    networks:
      - traefik-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
