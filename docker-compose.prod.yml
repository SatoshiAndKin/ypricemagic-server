networks:
  traefik-proxy:
    external: true
    name: traefik-proxy

x-ypm-service: &ypm-service
  image: ghcr.io/satoshiandkin/ypricemagic-server:latest
  init: true
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ["CMD-SHELL", "test ! -f /tmp/drain && curl -sf http://localhost:8001/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 1
    start_period: 600s
  networks:
    - traefik-proxy
  restart: unless-stopped
  stop_grace_period: 320s

services:
  ypm-ethereum:
    <<: *ypm-service
    environment:
      CHAIN_NAME: ethereum
      CHAIN_ID: 1
      RPC_URL: ${RPC_URL_ETHEREUM}
      ETHERSCAN_TOKEN: ${ETHERSCAN_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - cache-ethereum:/data/cache
      - brownie-ethereum:/root/.brownie
      - solcx:/root/.solcx
      - vvm:/root/.vvm
      - ypricemagic-ethereum:/root/.ypricemagic
      - appcache-ethereum:/app/cache
    labels:
      traefik.enable: "true"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 10"
      traefik.http.routers.ypm-ethereum.rule: "Host(`${VIRTUAL_HOST:-localhost}`) && PathPrefix(`/ethereum`)"
      traefik.http.routers.ypm-ethereum.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.middlewares.ypm-strip-ethereum.stripprefix.prefixes: /ethereum
      traefik.http.routers.ypm-ethereum.middlewares: ypm-strip-ethereum
      traefik.http.services.ypm-ethereum.loadbalancer.server.port: "8001"
      traefik.http.routers.ypm-health.rule: "Host(`${VIRTUAL_HOST:-localhost}`) && Path(`/health`)"
      traefik.http.routers.ypm-health.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.routers.ypm-health.service: ypm-ethereum

  ypm-base:
    <<: *ypm-service
    environment:
      CHAIN_NAME: base
      CHAIN_ID: 8453
      RPC_URL: ${RPC_URL_BASE}
      ETHERSCAN_TOKEN: ${ETHERSCAN_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - cache-base:/data/cache
      - brownie-base:/root/.brownie
      - solcx:/root/.solcx
      - vvm:/root/.vvm
      - ypricemagic-base:/root/.ypricemagic
      - appcache-base:/app/cache
    labels:
      traefik.enable: "true"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 10"
      traefik.http.routers.ypm-base.rule: "Host(`${VIRTUAL_HOST:-localhost}`) && PathPrefix(`/base`)"
      traefik.http.routers.ypm-base.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.middlewares.ypm-strip-base.stripprefix.prefixes: /base
      traefik.http.routers.ypm-base.middlewares: ypm-strip-base
      traefik.http.services.ypm-base.loadbalancer.server.port: "8001"

  frontend:
    image: ghcr.io/satoshiandkin/ypricemagic-server-frontend:latest
    labels:
      traefik.enable: "true"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 10"
      traefik.http.routers.ypm-frontend.rule: "Host(`${VIRTUAL_HOST:-localhost}`) && !PathPrefix(`/ethereum`) && !PathPrefix(`/arbitrum`) && !PathPrefix(`/optimism`) && !PathPrefix(`/base`) && !PathPrefix(`/bsc`) && !PathPrefix(`/polygon`) && !PathPrefix(`/fantom`) && !PathPrefix(`/health`)"
      traefik.http.routers.ypm-frontend.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.routers.ypm-frontend.priority: "1"
      traefik.http.services.ypm-frontend.loadbalancer.server.port: "8080"
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  cache-ethereum:
  brownie-ethereum:
  solcx:
  vvm:
  ypricemagic-ethereum:
  appcache-ethereum:
  cache-base:
  brownie-base:
  ypricemagic-base:
  appcache-base:
