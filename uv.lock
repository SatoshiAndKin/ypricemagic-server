[[package]]
name = "ypricemagic-server"
version = "0.13.0"
source = { virtual = "." }
dependencies = [
    { name = "diskcache" },
    { name = "fastapi" },
    { name = "prometheus-client" },
    { name = "sentry-sdk" },
    { name = "setuptools" },
    { name = "structlog" },
    { name = "tenacity" },
    { name = "uvicorn", extra = ["standard"] },
    { name = "ypricemagic" },
]

[package.optional-dependencies]
dev = [
    { name = "deptry" },
    { name = "httpx" },
    { name = "mypy" },
    { name = "pre-commit" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "pytest-randomly" },
    { name = "ruff" },
    { name = "vulture" },
]

[package.metadata]
requires-dist = [
    { name = "deptry", marker = "extra == 'dev'" },
    { name = "diskcache" },
    { name = "fastapi" },
    { name = "httpx", marker = "extra == 'dev'", specifier = ">=0.27,<1.0" },
    { name = "mypy", marker = "extra == 'dev'" },
    { name = "pre-commit", marker = "extra == 'dev'" },
    { name = "prometheus-client" },
    { name = "pytest", marker = "extra == 'dev'" },
    { name = "pytest-asyncio", marker = "extra == 'dev'" },
    { name = "pytest-cov", marker = "extra == 'dev'" },
    { name = "pytest-randomly", marker = "extra == 'dev'" },
    { name = "ruff", marker = "extra == 'dev'" },
    { name = "sentry-sdk", specifier = ">=2.0,<3" },
    { name = "setuptools", specifier = "<81" },
    { name = "structlog" },
    { name = "tenacity" },
    { name = "uvicorn", extras = ["standard"] },
    { name = "vulture", marker = "extra == 'dev'" },
    { name = "ypricemagic", git = "https://github.com/SatoshiAndKin/ypricemagic.git?rev=master" },
]
provides-extras = ["dev"]
