name: Reviewed Linux PR security scan

on:
  workflow_call:

permissions: {}

jobs:
  security-scan:
    if: github.repository == 'SatoshiAndKin/ypricemagic-server' && github.event_name == 'pull_request'
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Inventory all dependency vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-unfiltered.json

      - name: Retain unfiltered vulnerability inventory
        uses: actions/upload-artifact@v7
        with:
          name: dependency-vulnerabilities
          path: trivy-unfiltered.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
