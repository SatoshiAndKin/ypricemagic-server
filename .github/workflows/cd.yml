name: CD

on:
  # Use pull_request closed instead of push:main because auto-merges via
  # GITHUB_TOKEN don't fire push events (GitHub anti-recursion).
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set registry cache addresses
        id: cache
        run: |
          {
            echo "backend=${REGISTRY}/${IMAGE_NAME,,}:buildcache"
            echo "frontend=${REGISTRY}/${IMAGE_NAME,,}-frontend:buildcache"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.backend }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.backend }},mode=max
          platforms: linux/amd64

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.frontend }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.frontend }},mode=max
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          : "${WEBHOOK_URL:?DEPLOY_WEBHOOK_URL must be set}"
          : "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}"
          curl --fail --show-error --silent \
            -X POST \
            -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
            "${WEBHOOK_URL}"
