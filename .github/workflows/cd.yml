name: CD

on:
  # Use pull_request closed instead of push:main because auto-merges via
  # GITHUB_TOKEN don't fire push events (GitHub anti-recursion).
  pull_request:
    branches: [main]
    types: [closed]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "runbooks/**"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false


permissions: {}

jobs:
  build-and-push:
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    uses: SatoshiAndKin/ypricemagic-server/.github/workflows/cd-build-reviewed-linux.yml@42140a57d071d368b820a0cea18e65d16fb2a6aa

  deploy:
    needs: build-and-push
    permissions: {}
    uses: SatoshiAndKin/ypricemagic-server/.github/workflows/cd-deploy-reviewed-linux.yml@d285609b6f56d61cf574284531440d7aa5959333
    secrets:
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
