name: CD

on:
  # Use pull_request closed instead of push:main because auto-merges via
  # GITHUB_TOKEN don't fire push events (GitHub anti-recursion).
  pull_request:
    branches: [main]
    types: [closed]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "runbooks/**"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            image-suffix: ""
          - component: frontend
            context: ./frontend
            image-suffix: -frontend
    name: Build and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set registry addresses
        id: registry
        env:
          IMAGE_SUFFIX: ${{ matrix.image-suffix }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}${IMAGE_SUFFIX}"
          {
            echo "image=${image}"
            echo "cache=${image}:buildcache"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.registry.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.registry.outputs.cache }},mode=max
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Queue production deployment
        env:
          WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          MERGED_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?DEPLOY_WEBHOOK_URL must be set}"
          : "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}"
          payload=$(jq -cn --arg repository "$REPOSITORY" --arg commit "$MERGED_COMMIT" \
            '{repository: $repository, commit: $commit, targets: ["ypricemagic-server"]}')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
            --header "X-Webhook-Secret: $WEBHOOK_SECRET" \
            --header 'Content-Type: application/json' --data "$payload" "$WEBHOOK_URL"
          echo 'Tank stored the deployment request. Its worker records the final result separately.'
