name: Update ypricemagic dependency

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Open a dependency PR (unchecked only resolves and verifies the lock)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-ypricemagic

jobs:
  update:
    permissions:
      contents: read
      pull-requests: read
    uses: SatoshiAndKin/ypricemagic-server/.github/workflows/update-ypricemagic-reviewed-linux.yml@eb7317a67a2834b0c215dcc04f207926dff4147d
    with:
      publish: ${{ inputs.publish || false }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
