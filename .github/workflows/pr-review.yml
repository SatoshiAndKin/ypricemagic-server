name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - "**.md"
      - "**.png"
      - ".factory/validation/**"
      - "docs/**"
      - "runbooks/**"

concurrency:
  # Keep this key in sync with pr-review-cancel.yml.
  group: pr-review-${{ github.event.number && format('refs/pull/{0}/merge', github.event.number) || (startsWith(github.ref, 'refs/pull/') && github.ref) || format('pr-no-number-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      security-events: write
    uses: SatoshiAndKin/ypricemagic-server/.github/workflows/pr-review-reviewed-linux.yml@eb7317a67a2834b0c215dcc04f207926dff4147d
