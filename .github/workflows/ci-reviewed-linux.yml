name: Reviewed Linux CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-image:
    if: github.repository == 'SatoshiAndKin/ypricemagic-server' && (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Resolve Debian package snapshots
        id: apt
        run: bash .github/scripts/debian-apt-snapshot.sh latest
      - name: Build production backend image on native amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ypm-server:ci
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            DEBIAN_ARCHIVE_SNAPSHOT=${{ steps.apt.outputs.archive }}
            DEBIAN_SECURITY_SNAPSHOT=${{ steps.apt.outputs.security }}
          push: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=ypm-backend-amd64
            type=registry,ref=ghcr.io/satoshiandkin/ypricemagic-server:buildcache
          cache-to: type=gha,scope=ypm-backend-amd64,mode=max,timeout=2m,ignore-error=true
      - name: Test the backend image
        run: bash .github/scripts/check-backend-image.sh ypm-server:ci "$GITHUB_SHA"
      - name: Record the tested Debian snapshot
        if: github.event_name == 'pull_request'
        env:
          DEBIAN_ARCHIVE: ${{ steps.apt.outputs.archive }}
          DEBIAN_SECURITY: ${{ steps.apt.outputs.security }}
        run: |
          bash .github/scripts/debian-apt-snapshot.sh record "$DEBIAN_ARCHIVE" "$DEBIAN_SECURITY" "$RUNNER_TEMP/snapshot.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request'
        with:
          name: debian-apt-snapshot
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  frontend-image:
    if: github.repository == 'SatoshiAndKin/ypricemagic-server' && (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the shipped frontend image (no publication)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          load: true
          tags: ypm-frontend:ci
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=ypm-frontend-amd64
            type=registry,ref=ghcr.io/satoshiandkin/ypricemagic-server-frontend:buildcache
          cache-to: type=gha,scope=ypm-frontend-amd64,mode=max,timeout=2m,ignore-error=true
      - name: Validate shipped nginx config and image metadata
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ypm-frontend:ci)" = "$GITHUB_SHA"
          docker run --rm --network none --entrypoint sh ypm-frontend:ci \
            -c 'test ! -e /usr/share/nginx/html/.git && nginx -t'

  frontend:
    if: github.repository == 'SatoshiAndKin/ypricemagic-server' && (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - name: Build and verify the Sentry release in the frontend bundle
        env:
          VITE_SENTRY_DSN: https://public@example.invalid/1
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          npm run build
          grep -Fq "$GITHUB_SHA" dist/assets/*.js

  lockfile:
    if: github.repository == 'SatoshiAndKin/ypricemagic-server' && (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    # Immutable Git dependencies make this reproducible on both PRs and pushes.
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile is up to date
        run: uv lock --check

  lint-and-test:
    if: github.repository == 'SatoshiAndKin/ypricemagic-server' && (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Check unused dependencies
        run: uv run deptry .

      - name: Run tests with coverage
        run: uv run pytest
