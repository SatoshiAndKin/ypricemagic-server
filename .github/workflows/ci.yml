name: CI

on:
  push:
    branches: [main, release-please--branches--main]
    paths-ignore:
      - "**.md"
      - "**.png"
      - ".factory/validation/**"
      - "docs/**"
      - "runbooks/**"
      - "*.json"  # release-please-config, etc.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build production backend image on native amd64
        run: docker build --tag ypm-server:ci .
      - name: Import compiled dependencies in the runtime image
        run: docker run --rm --entrypoint python ypm-server:ci -c 'import brownie, dank_mids, cachebox'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build

  lockfile:
    # Immutable Git dependencies make this reproducible on both PRs and pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile is up to date
        run: uv lock --check

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Check unused dependencies
        run: uv run deptry .

      - name: Run tests with coverage
        run: uv run pytest
