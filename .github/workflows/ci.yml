name: CI

on:
  push:
    branches: [main, release-please--branches--main]
    paths-ignore:
      - "**.md"
      - "**.png"
      - ".factory/validation/**"
      - "docs/**"
      - "runbooks/**"
      - "*.json"  # release-please-config, etc.
  pull_request:
    branches: [main]
    # A close takes the PR's concurrency slot without starting a runner.
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  # A merged close can point at main; never share its group without a PR number.
  group: ci-${{ github.event.number && format('refs/pull/{0}/merge', github.event.number) || (github.event_name == 'pull_request' && !startsWith(github.ref, 'refs/pull/') && format('pr-no-number-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: true

# PR cache writes stay in GitHub's PR merge-ref namespace. No PR registry
# credentials: release jobs must not import PR-produced cache records.
permissions:
  contents: read

jobs:
  linux:
    uses: SatoshiAndKin/ypricemagic-server/.github/workflows/ci-reviewed-linux.yml@4fd799764b5557ed16a0ab335344e49ac4e7818c
