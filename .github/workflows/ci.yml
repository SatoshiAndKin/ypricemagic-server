name: CI

on:
  push:
    branches: [main, release-please--branches--main]
    paths-ignore:
      - "**.md"
      - "**.png"
      - ".factory/validation/**"
      - "docs/**"
      - "runbooks/**"
      - "*.json"  # release-please-config, etc.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build production backend image on native amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ypm-server:ci
          build-args: SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/satoshiandkin/ypricemagic-server:buildcache
      - name: Import compiled dependencies in the runtime image
        run: docker run --rm --entrypoint python ypm-server:ci -c 'import brownie, dank_mids, cachebox'
      - name: Verify the runtime Sentry release
        run: |
          docker run --rm --network none --env SENTRY_DSN=https://public@example.invalid/1 \
            --env "EXPECTED_RELEASE=$GITHUB_SHA" --entrypoint python ypm-server:ci \
            -c 'import os, sentry_sdk; from src.server import _init_sentry; _init_sentry(); assert sentry_sdk.get_client().options["release"] == os.environ["EXPECTED_RELEASE"]'

      - name: Verify HTTPS Sentry upload deadlines
        run: |
          docker run --rm --network none --entrypoint python ypm-server:ci \
            -m unittest src.tests.test_sentry_transport

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - name: Build and verify the Sentry release in the frontend bundle
        env:
          VITE_SENTRY_DSN: https://public@example.invalid/1
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          npm run build
          grep -Fq "$GITHUB_SHA" dist/assets/*.js

  lockfile:
    # Immutable Git dependencies make this reproducible on both PRs and pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile is up to date
        run: uv lock --check

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Check unused dependencies
        run: uv run deptry .

      - name: Run tests with coverage
        run: uv run pytest
