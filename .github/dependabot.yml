version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # setuptools<82 required: brownie/web3 depend on pkg_resources removed in 82+
      - dependency-name: setuptools
        versions: [">=82"]
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: docker-compose
    directories:
      - /
      - /traefik-proxy
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
