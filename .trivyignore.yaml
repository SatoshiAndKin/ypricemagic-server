# Application-scoped findings after the listed mitigations; review by 2026-12-10.
# CI retains an unfiltered JSON inventory alongside the filtered SARIF report.
vulnerabilities:
  - id: CVE-2025-69872
    paths: [uv.lock]
    purls: ["pkg:pypi/diskcache@5.6.3"]
    expired_at: 2026-12-10
    statement: >-
      The only runtime diskcache consumer uses _JSONOnlyDisk. It rejects
      non-raw keys and non-JSON value modes before diskcache can invoke pickle.
      TestJSONOnlyCache tests tampered SQLite keys/values through public cache
      reads and verifies pickle.load is never called; normal JSON remains readable.
  - id: CVE-2026-59890
    paths: [uv.lock]
    purls: ["pkg:pypi/setuptools@81.0.0"]
    expired_at: 2026-12-10
    statement: >-
      This advisory concerns MANIFEST.in exclusions while building sdists on
      macOS normalization-preserving filesystems. The supported build/deployment
      builds wheels on Linux and this application has no MANIFEST.in or sdist
      build flow. Brownie requires pkg_resources, removed in setuptools 82+.
      This exception does not cover introducing macOS sdist publishing.
