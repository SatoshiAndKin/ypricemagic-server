# Application-scoped findings reviewed on 2026-11-23; review again by 2026-12-23.
# CI retains an unfiltered JSON inventory alongside the filtered SARIF report.
vulnerabilities:
  - id: CVE-2025-69872
    paths: [uv.lock]
    purls: ["pkg:pypi/diskcache@5.6.3"]
    expired_at: 2026-12-23
    statement: >-
      The only runtime diskcache consumer uses _JSONOnlyDisk. It rejects
      non-raw keys and non-JSON value modes before diskcache can invoke pickle.
      TestJSONOnlyCache tests tampered SQLite keys/values through public cache
      reads and verifies pickle.load is never called; normal JSON remains readable.
  - id: CVE-2026-59890
    paths: [uv.lock]
    purls: ["pkg:pypi/setuptools@81.0.0"]
    expired_at: 2026-12-23
    statement: >-
      This advisory affects MANIFEST.in exclusions when building source
      distributions on normalization-preserving macOS filesystems. Production
      builds and installs wheels on Linux. The server has no MANIFEST.in or
      source-distribution publishing workflow. Brownie still requires
      pkg_resources, which is removed in setuptools 82. Reassess this exception
      before adding macOS source-distribution publishing.
  - id: GHSA-xmj3-9gf7-h52w
    paths: [uv.lock]
    purls: ["pkg:pypi/setuptools@81.0.0"]
    expired_at: 2026-12-23
    statement: >-
      This advisory affects Windows legacy Wheel.install_as_egg when a wheel
      contains a drive-qualified namespace_packages.txt path. The supported
      server build and runtime use Linux and uv wheel installation. Neither
      uses setuptools' legacy egg installer. Reassess this exception before
      introducing Windows installation or a legacy egg installation path.
