# Application-scoped findings after the listed mitigations; review by 2026-11-01.
# CI retains an unfiltered JSON inventory alongside the filtered SARIF report.
vulnerabilities:
  - id: CVE-2026-40072
    paths: [uv.lock]
    purls: ["pkg:pypi/web3@6.11.0"]
    expired_at: 2026-11-01
    statement: >-
      Both pricing providers disable automatic CCIP reads in lifespan.
      TestContractURLPolicy.test_lifespan_disables_automatic_offchain_http
      reproduces OffchainLookup on real sync/async Web3 call paths and verifies
      that neither HTTP handler runs. Retain Web3 6 for the current pricing fork;
      remove this exception when its Web3 7 migration is supported.
  - id: CVE-2025-69872
    paths: [uv.lock]
    purls: ["pkg:pypi/diskcache@5.6.3"]
    expired_at: 2026-11-01
    statement: >-
      The only runtime diskcache consumer uses _JSONOnlyDisk. It rejects
      non-raw keys and non-JSON value modes before diskcache can invoke pickle.
      TestJSONOnlyCache tests tampered SQLite keys/values through public cache
      reads and verifies pickle.load is never called; normal JSON remains readable.
  - id: CVE-2026-59890
    paths: [uv.lock]
    purls: ["pkg:pypi/setuptools@80.10.2"]
    expired_at: 2026-11-01
    statement: >-
      This advisory concerns MANIFEST.in exclusions while building sdists on
      macOS normalization-preserving filesystems. The supported build/deployment
      builds wheels on Linux and this application has no MANIFEST.in or sdist
      build flow. Web3 6 requires pkg_resources, removed in setuptools 81+.
      This exception does not cover introducing macOS sdist publishing.
