[project]
name = "ypricemagic-server"
version = "0.12.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dank-mids @ git+https://github.com/SatoshiAndKin/dank_mids.git@33d64a962a2ff2a60f4ddb0d1d17e6b0fbbd89c0",
    "ypricemagic @ git+https://github.com/SatoshiAndKin/ypricemagic.git@e64d4282f4dfeca3b291f65790a6262ae3018965",
    "fastapi",
    "uvicorn[standard]",
    "diskcache",
    "structlog",
    "prometheus-client",
    "tenacity",
    "setuptools<81",
    "sentry-sdk>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly",
    "httpx>=0.27,<1.0",
    "mypy",
    "ruff",
    "deptry",
    "vulture",
    "pre-commit",
]

[tool.uv]
prerelease = "allow"
# Allow old Brownie/ABI build pins and dank-mids' nested Git source in isolation.
build-constraint-dependencies = [
    "cchecksum @ git+https://github.com/SatoshiAndKin/cchecksum.git@fff7e1fe87f4679ec96de1cebb1cdd8f5e94be44",
    "evmspec @ git+https://github.com/SatoshiAndKin/evmspec.git@31c8540a14228ca49c77c19d565a6aaee3d0079f",
]
override-dependencies = [
    # Brownie's frozen dependency list includes vulnerable and incompatible pins.
    # Preserve the server security overrides with the immutable Web3 v7 stack.
    "aiohttp>=3.14.3,<4",
    "cbor2>=5.9.0,<6",
    "idna>=3.20,<4",
    "pygments>=2.21.0,<3",
    "python-dotenv>=1.2.4,<2",
    "requests>=2.34.2,<3",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-forked>=1.6",
    "cchecksum @ git+https://github.com/SatoshiAndKin/cchecksum.git@fff7e1fe87f4679ec96de1cebb1cdd8f5e94be44",
    "faster-eth-abi==5.2.30",
    "faster-eth-utils==5.3.28",
    "protobuf>=6.33.5,<7",
    "ujson>=5.12.0",
    "urllib3>=2.6.3",
    "wheel>=0.46.2",
    "packaging>=24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".factory"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]  # CLI scripts use print() for output

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--disable-plugin-autoload -p pytest_asyncio.plugin -p pytest_cov.plugin --durations=10 -v -p no:pytest_ethereum -p no:pytest-brownie --cov=src --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.deptry]
per_rule_ignores = {DEP001 = ["playwright"], DEP002 = ["uvicorn", "setuptools", "pre-commit", "pytest-cov", "pytest-randomly", "pytest-asyncio", "httpx", "mypy", "ruff", "deptry", "vulture"], DEP003 = ["brownie", "dank_mids", "y", "web3", "yaml", "starlette"]}
